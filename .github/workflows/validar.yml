name: Compilar y validar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-sin-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar y ejecutar pruebas sin credenciales ni acceso a SQL
        shell: pwsh
        run: ./scripts/validar.ps1
